<!-- 3. High-Resolution Social / Community Avatar (avatar-800x800.svg) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A896" />
      <stop offset="100%" stop-color="#028090" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="slateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <filter id="avatarShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#avatarBgGrad)" />

  <g transform="translate(260, 260) scale(2.7)" filter="url(#avatarShadow)">
    <rect x="0" y="44" width="52" height="52" rx="14" fill="url(#navyGrad)" />
    <rect x="26" y="0" width="52" height="52" rx="14" fill="url(#tealGrad)" />
    <rect x="52" y="44" width="52" height="52" rx="14" fill="url(#slateGrad)" stroke="#CBD5E1" stroke-width="1.5" />
  </g>
</svg>
