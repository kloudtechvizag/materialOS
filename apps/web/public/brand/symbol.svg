<!-- MaterialOS compact symbol: the icon-only mark, extracted from
     brand_assets/logo-primary-light.svg's icon group so every usage
     (favicons, sidebar, mobile drawer, receipts, login/signup) renders
     the exact same three-square mark instead of a separately-drawn copy. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 124 116" width="100%" height="100%">
  <defs>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8800" />
      <stop offset="100%" stop-color="#FF6B00" />
    </linearGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>
  </defs>
  <g filter="url(#softShadow)">
    <rect x="0" y="44" width="52" height="52" rx="14" fill="url(#violetGrad)" />
    <rect x="26" y="0" width="52" height="52" rx="14" fill="url(#emeraldGrad)" />
    <rect x="52" y="44" width="52" height="52" rx="14" fill="url(#coralGrad)" />
  </g>
</svg>
