[package]
name = "materialos-desktop"
version = "0.2.7"
description = "MaterialOS desktop client -- native shell around apps/web"
authors = ["MaterialOS"]
edition = "2021"

[lib]
# Tauri v2 convention: main.rs stays a thin binary entrypoint, lib.rs
# holds the actual app builder -- this is what lets the same setup code
# be reused by a future mobile target without duplicating it.
name = "materialos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Windows-only: SetCurrentProcessExplicitAppUserModelID (lib.rs) -- so a
# taskbar-pinned shortcut groups under this app's own identity/icon
# instead of Explorer's default fallback grouping.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Shell", "Win32_Foundation"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
