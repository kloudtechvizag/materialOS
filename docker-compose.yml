version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: materialos
      POSTGRES_PASSWORD: materialos
      POSTGRES_DB: materialos
    ports:
      - "55432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U materialos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    env_file:
      - ./apps/api/.env
    ports:
      - "58000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./apps/api
    env_file:
      - ./apps/api/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
    command: celery -A app.celery_app worker --loglevel=info

  # ADR-013: runs the daily backup schedule (celery_app.py's
  # beat_schedule). The worker above only executes jobs it's handed --
  # without this process, on-demand backups/notification retries still
  # work, but nothing ever triggers the scheduled daily backup.
  beat:
    build:
      context: ./apps/api
    env_file:
      - ./apps/api/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
    command: celery -A app.celery_app beat --loglevel=info -s /tmp/celerybeat-schedule

  waha:
    image: devlikeapro/waha:latest
    restart: unless-stopped
    ports:
      - "53000:3000"
    environment:
      - WAHA_ZIP_JSON_VALUE=True
      - WAHA_PRINT_QR=False
      - WAHA_DASHBOARD_ENABLED=True
      - WAHA_APPS_ENABLED=True
      - WAHA_APPS_ON=calls,chatwoot,mcp
      - WHATSAPP_DEFAULT_ENGINE=NOWEB
      - REDIS_URL=redis://redis:6379/1
      - WAHA_API_KEY=materialos_secret_waha_key
      - WAHA_API_KEY_PLAIN=materialos_secret_waha_key
      - WHATSAPP_API_KEY=materialos_secret_waha_key
      - WHATSAPP_HOOK_URL=http://api:8000/api/v1/communication/webhooks/waha
      - WHATSAPP_HOOK_EVENTS=message,session.status,message.ack
    volumes:
      - waha_sessions:/app/.sessions
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  db_data:
  waha_sessions:
