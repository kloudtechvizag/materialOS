version: "3.9"

services:

  # ---------------------------------------------------------------------------
  # Traefik — Edge Ingress (ADR-014)
  # Routes all HTTP traffic on port 80 by hostname:
  #   http://localhost          → frontend (web)
  #   http://app.localhost      → frontend (web) alias
  #   http://api.localhost      → API (FastAPI)
  #   http://waha.localhost     → WAHA WhatsApp gateway
  #   http://traefik.localhost  → Traefik dashboard
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    command:
      - "--log.level=INFO"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--metrics.prometheus=true"
      - "--accesslog=true"
      - "--accesslog.format=json"
    ports:
      - "80:80"        # Main HTTP ingress — all services here
      - "8080:8080"    # Traefik dashboard → http://traefik.localhost:8080 or http://localhost:8080
    volumes:
      - ./infra/traefik:/etc/traefik/dynamic:ro

  # ---------------------------------------------------------------------------
  # Database
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: materialos
      POSTGRES_PASSWORD: materialos
      POSTGRES_DB: materialos
    ports:
      - "55432:5432"   # kept for direct psql access from host
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U materialos"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"   # kept for redis-cli access from host
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # API — FastAPI / uvicorn
  # Accessible at: http://api.localhost/api/v1/...
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./apps/api
    env_file:
      - ./apps/api/.env
    ports:
      - "58000:8000"   # Direct host access for backwards compatibility & dev
    expose:
      - "8000"          # internal only — Traefik proxies it
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.localhost`) || (Host(`localhost`) && PathPrefix(`/api`))"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=8000"

  # ---------------------------------------------------------------------------
  # Celery Worker
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: ./apps/api
    env_file:
      - ./apps/api/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
    command: celery -A app.celery_app worker --loglevel=info

  # ---------------------------------------------------------------------------
  # Celery Beat — scheduled jobs (daily backups, etc.)
  # ---------------------------------------------------------------------------
  beat:
    build:
      context: ./apps/api
    env_file:
      - ./apps/api/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
    command: celery -A app.celery_app beat --loglevel=info -s /tmp/celerybeat-schedule

  # ---------------------------------------------------------------------------
  # WAHA — WhatsApp HTTP API (devlike.pro)
  # Accessible at: http://waha.localhost
  # ---------------------------------------------------------------------------
  waha:
    image: devlikeapro/waha:latest
    restart: unless-stopped
    ports:
      - "53000:3000"   # Direct host access for backwards compatibility & dev
    expose:
      - "3000"          # internal only — Traefik proxies it
    environment:
      - WAHA_ZIP_JSON_VALUE=True
      - WAHA_PRINT_QR=False
      - WAHA_DASHBOARD_ENABLED=True
      - WAHA_APPS_ENABLED=True
      - WAHA_APPS_ON=calls,chatwoot,mcp
      - WHATSAPP_DEFAULT_ENGINE=NOWEB
      - REDIS_URL=redis://redis:6379/1
      - WAHA_API_KEY=materialos_secret_waha_key
      - WAHA_API_KEY_PLAIN=materialos_secret_waha_key
      - WHATSAPP_API_KEY=materialos_secret_waha_key
      - WHATSAPP_HOOK_URL=http://api:8000/api/v1/communication/webhooks/waha
      - WHATSAPP_HOOK_EVENTS=message,session.status,message.ack
    volumes:
      - waha_sessions:/app/.sessions
    depends_on:
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.waha.rule=Host(`waha.localhost`)"
      - "traefik.http.routers.waha.entrypoints=web"
      - "traefik.http.services.waha.loadbalancer.server.port=3000"

  # ---------------------------------------------------------------------------
  # Frontend — Vite dev server
  # Accessible at: http://localhost  or  http://app.localhost
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./apps/web
    ports:
      - "5173:5173"   # Direct host access for Vite dev server & browser tab
    expose:
      - "5173"          # internal only — Traefik proxies it
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`localhost`) || Host(`app.localhost`)"
      - "traefik.http.routers.web.entrypoints=web"
      - "traefik.http.services.web.loadbalancer.server.port=5173"

volumes:
  db_data:
  waha_sessions:
