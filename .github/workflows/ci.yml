name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: materialos
          POSTGRES_PASSWORD: materialos
          POSTGRES_DB: materialos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U materialos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATIONS_DATABASE_URL: postgresql+psycopg://materialos:materialos@localhost:5432/materialos
      DATABASE_URL: postgresql+psycopg://materialos_app:materialos_app_dev_password@localhost:5432/materialos
      APP_DB_PASSWORD: materialos_app_dev_password
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npx tsc -b
      - run: npm run build
