name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: materialos
          POSTGRES_PASSWORD: materialos
          POSTGRES_DB: materialos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U materialos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATIONS_DATABASE_URL: postgresql+psycopg://materialos:materialos@localhost:5432/materialos
      DATABASE_URL: postgresql+psycopg://materialos_app:materialos_app_dev_password@localhost:5432/materialos
      APP_DB_PASSWORD: materialos_app_dev_password
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npx tsc -b
      - run: npm run build

  # Fast Linux-only compile check on every push/PR (ADR-012) -- catches
  # a broken Cargo.toml/tauri.conf.json/lib.rs before it reaches a
  # release tag. This is exactly the `cargo check` this repo's own dev
  # environment could not run locally (no root to install
  # libwebkit2gtk-4.1-dev etc.) -- a real GitHub Actions runner has it.
  # The actual Windows/Linux installer builds live in
  # desktop-release.yml, only on version tags (or manual dispatch) --
  # they're too slow for every PR.
  desktop-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo check
        working-directory: apps/desktop/src-tauri
