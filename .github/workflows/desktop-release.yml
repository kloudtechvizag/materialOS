name: desktop-release

# ADR-012: builds real, installable Windows (.msi) and Linux (.deb +
# .AppImage) binaries via the official tauri-apps/tauri-action, one
# native runner per target (Tauri apps are not cross-compiled --
# Windows needs WebView2 on a Windows runner). Triggered on
# desktop-v* tags rather than every push: this is a slow job (fresh
# Rust dependency compile per OS) and produces install artifacts,
# unlike ci.yml's desktop-check, which just proves it compiles.
# workflow_dispatch is also enabled so a build can be requested
# on-demand without cutting a tag first.
#
# macOS is intentionally not in this matrix -- not asked for, and
# macOS GitHub-hosted runners carry a 10x per-minute cost multiplier
# on private repos. Re-adding it is one matrix entry (see git history
# on this file / ADR-012 for the exact `--target aarch64-apple-darwin`
# / `x86_64-apple-darwin` entries this file had before), not a
# structural change.
#
# Publishing is unsigned by default (no code-signing certificates are
# configured in this repo's secrets) -- Windows SmartScreen will warn
# on an unsigned .msi. That's an intentional gap, not an oversight:
# faking a signature isn't possible without a real certificate, and
# this workflow doesn't pretend otherwise. Add
# TAURI_SIGNING_PRIVATE_KEY (updater signing) and a code-signing
# certificate secret when this is ready to distribute outside the team.

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

jobs:
  # tauri-action's own "create the release if it doesn't exist yet"
  # logic races when both matrix jobs below call it at once for the
  # SAME tag: whichever job's create-release call loses gets a real
  # "Validation Failed: {\"resource\":\"Release\",\"code\":\"already_
  # exists\"...}" and its whole job (compile included) is marked
  # failed -- confirmed from an actual run (desktop-v0.2.4): Windows
  # won the race and published; Linux compiled fine but never got to
  # upload its .deb/.rpm/.AppImage because its own create call 409'd.
  # Creating the (draft) release once, first, in its own job, and
  # having each matrix job only *upload* to that known release id
  # removes the race instead of trying to win it.
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/github-script@v7
        id: create
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: `MaterialOS Desktop ${context.ref.replace('refs/tags/', '')}`,
              draft: true,
              prerelease: false,
            });
            return data.id;

  build:
    needs: create-release
    # The build itself needs no special access; uploading to the
    # release created above does.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/desktop/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: apps/web

      - name: Install desktop (Tauri CLI) dependencies
        # tauri-action doesn't install this for you -- it just runs
        # `npm run tauri build` in projectPath and expects the `tauri`
        # binary (from @tauri-apps/cli, apps/desktop's own
        # package.json) to already be on PATH via node_modules/.bin.
        # Without this step that script fails immediately with
        # "'tauri' is not recognized" on Windows / "command not found"
        # on Linux, before Rust or the frontend build ever run.
        run: npm ci
        working-directory: apps/desktop

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          # A release build (`tauri build`) compiles in release profile
          # (this repo's Cargo.toml also sets lto = true, codegen-units
          # = 1 -- both slow) -- keep whatever compiled even if a later
          # step (bundling, tauri-action itself) fails, so a
          # fix-and-retry loop doesn't recompile the whole dependency
          # tree from zero every time, which is exactly the loop this
          # workflow has been in the last couple of pushes.
          cache-on-failure: "true"

      - name: Install Tauri Linux build dependencies (cached)
        if: matrix.platform == 'ubuntu-22.04'
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
          version: 1.0

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          # Upload-only: releaseId (not tagName/releaseName) points
          # tauri-action at the release create-release already made,
          # so this step can't race the other matrix job to create it.
          releaseId: ${{ needs.create-release.outputs.release_id }}

  # Un-drafts the release once both platforms have uploaded, so it's
  # never visible on the public Releases page half-built (e.g. Windows
  # assets up, Linux still compiling). Still genuinely unsigned -- see
  # this file's header comment.
  publish-release:
    needs: [create-release, build]
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
              prerelease: false,
            });
