name: desktop-release

# ADR-012: builds real, installable Windows (.msi) and Linux (.deb +
# .AppImage) binaries via the official tauri-apps/tauri-action, one
# native runner per target (Tauri apps are not cross-compiled --
# Windows needs WebView2 on a Windows runner). Triggered on
# desktop-v* tags rather than every push: this is a slow job (fresh
# Rust dependency compile per OS) and produces install artifacts,
# unlike ci.yml's desktop-check, which just proves it compiles.
# workflow_dispatch is also enabled so a build can be requested
# on-demand without cutting a tag first.
#
# macOS is intentionally not in this matrix -- not asked for, and
# macOS GitHub-hosted runners carry a 10x per-minute cost multiplier
# on private repos. Re-adding it is one matrix entry (see git history
# on this file / ADR-012 for the exact `--target aarch64-apple-darwin`
# / `x86_64-apple-darwin` entries this file had before), not a
# structural change.
#
# Publishing is unsigned by default (no code-signing certificates are
# configured in this repo's secrets) -- Windows SmartScreen will warn
# on an unsigned .msi. That's an intentional gap, not an oversight:
# faking a signature isn't possible without a real certificate, and
# this workflow doesn't pretend otherwise. Add
# TAURI_SIGNING_PRIVATE_KEY (updater signing) and a code-signing
# certificate secret when this is ready to distribute outside the team.

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install web dependencies
        run: npm ci
        working-directory: apps/web

      - name: Install desktop (Tauri CLI) dependencies
        # tauri-action doesn't install this for you -- it just runs
        # `npm run tauri build` in projectPath and expects the `tauri`
        # binary (from @tauri-apps/cli, apps/desktop's own
        # package.json) to already be on PATH via node_modules/.bin.
        # Without this step that script fails immediately with
        # "'tauri' is not recognized" on Windows / "command not found"
        # on Linux, before Rust or the frontend build ever run.
        run: npm ci
        working-directory: apps/desktop

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install Tauri Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "MaterialOS Desktop ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
