<!-- 2. Stacked / Centered Brand Mark (logo-stacked-light.svg) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A896" />
      <stop offset="100%" stop-color="#028090" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="slateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Centered Icon Mark -->
  <g transform="translate(148, 40)" filter="url(#softShadow)">
    <rect x="0" y="44" width="52" height="52" rx="14" fill="url(#navyGrad)" />
    <rect x="26" y="0" width="52" height="52" rx="14" fill="url(#tealGrad)" />
    <rect x="52" y="44" width="52" height="52" rx="14" fill="url(#slateGrad)" stroke="#CBD5E1" stroke-width="1.5" />
  </g>

  <!-- Centered Wordmark -->
  <text x="200" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" letter-spacing="-1.5">
    <tspan font-weight="600" fill="#028090">Material</tspan><tspan font-weight="800" fill="#1E3A8A">OS</tspan>
  </text>
  <text x="200" y="240" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="3" fill="#028090" opacity="0.8">DESIGN SYSTEM &amp; FRAMEWORK</text>
</svg>
