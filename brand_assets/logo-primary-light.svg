<!-- logo-primary-light.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%">
  <defs>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8800" />
      <stop offset="100%" stop-color="#FF6B00" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>
  </defs>

  <g transform="translate(40, 25)" filter="url(#softShadow)">
    <rect x="0" y="44" width="52" height="52" rx="14" fill="url(#violetGrad)" />
    <rect x="26" y="0" width="52" height="52" rx="14" fill="url(#emeraldGrad)" />
    <rect x="52" y="44" width="52" height="52" rx="14" fill="url(#coralGrad)" />
  </g>

  <text x="175" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" letter-spacing="-1.5">
    <tspan font-weight="600" fill="#059669">Material</tspan><tspan font-weight="800" fill="#6D28D9">OS</tspan>
  </text>
</svg>
